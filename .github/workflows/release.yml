name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.1.0). Leave blank to build the current commit."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.6.0
      - name: build sdist and wheel
        run: |
          python -m build --sdist --wheel
      - name: verify artifacts
        run: |
          test -n "$(ls dist/*.whl)"
          test -n "$(ls dist/*.tar.gz)"
          python - <<'PY'
          import pathlib
          for p in sorted(pathlib.Path("dist").iterdir()):
              print(p.name, p.stat().st_size)
          PY
      - name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    continue-on-error: true
    permissions:
      id-token: write
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
